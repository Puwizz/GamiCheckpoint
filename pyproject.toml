[project]
name = "origami-checker-ai"
version = "0.1.0"
description = "AI-powered real-time origami folding verification system"
requires-python = ">=3.11"
dependencies = [
    # Core
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    # Deep Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.3.0",
    # Visualization & Utilities
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.3.0",
    "imagehash>=4.3.1",
    # Web App
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.32",
    # Notebook
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
